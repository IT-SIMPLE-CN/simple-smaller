# cargo-about 配置（mac 版随包的 Rust 依赖）。由 scripts/gen-licenses.sh 调用。
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 双重许可的 crate 按这里的先后选一个列出（先选文本短的宽松许可）。
accepted = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]
# 本仓库自己的 crate（publish = false）不列。
private = { ignore = true }
