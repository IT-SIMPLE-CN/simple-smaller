<h3>第一个版本</h3>
<ul>
<li><b>图片</b>：压成 WebP、AVIF、JPG、PNG，可按宽、高或长边缩放，一次出多档尺寸；按小红书、公众号等比例批量裁切，每张可手调。</li>
<li><b>视频</b>：按体积压到发群能发的大小，截取一段、裁成 9:16，或拆成一张张序列帧。</li>
<li><b>PDF</b>：邮件附件、屏幕阅读、打印保真三档压缩；合并、拆分、转图片、图片转 PDF，可加打开密码。</li>
<li><b>不开窗口也能用</b>：访达里按住 ⌥ 点文件弹出圆环，或右键「服务」；复制的截图可以自动换成小图。</li>
<li>全部在本机处理，原文件不动，压完变大会保留原文件，一键撤销。</li>
</ul>
