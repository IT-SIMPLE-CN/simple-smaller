# cargo-deny：防止引入许可证不兼容的 Rust 依赖。本地或 CI 里跑：
#   cargo deny check licenses
# 新依赖的许可证不在下面的白名单里时会失败；确认与 AGPL-3.0 兼容后再加进来。
[graph]
# 两端发布的目标平台。
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]

[licenses]
allow = [
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
]
confidence-threshold = 0.9
# 白名单是允许范围，眼下没用到的条目不报警。
unused-allowed-license = "allow"

[licenses.private]
# 本仓库自己的 crate（publish = false）按根目录 LICENSE（AGPL-3.0-only）。
ignore = true
