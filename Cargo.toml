[workspace]
resolver = "3"
members = ["core", "core-host", "tools/uniffi-bindgen", "tools/bench-image", "tools/bench-video", "tools/bench-pdf"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
# mac 端用 UniFFI 生成 Swift 绑定（Windows 端经独立进程 smaller-core.exe 调用，不用绑定）。
uniffi = "0.31.2"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
