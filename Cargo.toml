[workspace]
resolver = "3"
members = ["core", "tools/uniffi-bindgen", "tools/bench-image", "tools/bench-video", "tools/bench-pdf"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
# 跟 uniffi-bindgen-cs（C# 绑定）支持的版本走，升级前先看它的兼容表。
uniffi = "0.31.2"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
